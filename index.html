<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Kestrel Field Ops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: first-person ops office. Window onto the flightline on top, the base computer on the desk below. */
:root{
  color-scheme: dark;
  --wall:#1e1915;
  --frame:#40352c;
  --desk:#54473a;
  --desk-edge:#6b5c4a;
  --bezel:#6b5238;
  --screen:#d4c4a2;
  --paper2:#c7b692;
  --amber:#7a2e1f;
  --amber-dim:#a3412a;
  --ink:#2e2620;
  --muted:#5c4e3e;
  --cyan:#24506e;
  --ok:#465432;
  --warn:#8a5a1e;
  --crit:#a32a1d;
  --grid:rgba(46,38,32,.12);
  --line:rgba(46,38,32,.45);
  --rule:rgba(46,38,32,.28);
  --lcd:#1e1915;
  --lcd-ink:#e6c25a;
  --lcd-dim:#a08e72;
  --f-disp:"Jersey 10","Silkscreen",monospace;
  --f-ui:"Pixelify Sans","Silkscreen",monospace;
  --f-label:"Silkscreen","Pixelify Sans",monospace;
}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--f-ui);font-size:13px;overflow:hidden}
*{box-sizing:border-box}
.room{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(150px,45%) minmax(0,1fr)}
.windowband{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;min-height:0;background:var(--wall)}
.window{position:relative;height:100%;max-width:1400px;margin:0 auto;border-radius:5px;background:var(--frame);padding:10px;box-shadow:0 0 0 2px #0c0e10,inset 0 1px 0 rgba(255,255,255,.06),0 18px 40px rgba(0,0,0,.5)}
.glass{position:relative;width:100%;height:100%;overflow:hidden;border-radius:2px;background:#0a0d12}
#outside{display:block;width:100%;height:100%}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,rgba(255,255,255,.07) 0%,transparent 24%,transparent 58%,rgba(255,255,255,.035) 68%,transparent 76%)}
.mullion{position:absolute;top:10px;bottom:10px;left:50%;width:9px;margin-left:-4.5px;background:var(--frame);box-shadow:-1px 0 0 rgba(0,0,0,.5),1px 0 0 rgba(255,255,255,.04)}
.blinds{position:absolute;left:10px;right:10px;top:10px;height:7%;background:repeating-linear-gradient(to bottom,#3b4046 0 5px,#24282c 5px 7px);box-shadow:0 4px 8px rgba(0,0,0,.45)}
.plate{position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);display:flex;gap:14px;padding:1px 12px;font-family:var(--f-label);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8d949b;background:var(--frame);border-radius:3px 3px 0 0;white-space:nowrap}
.desk{position:relative;min-height:0;display:flex;justify-content:center;gap:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 0;background:linear-gradient(to bottom,#101215 0 8px,var(--desk-edge) 8px 12px,var(--desk) 12px,#25221f 100%)}
.monitor{flex:1;max-width:1180px;min-width:0;display:flex;flex-direction:column;background:var(--bezel);border-radius:12px 12px 0 0;padding:11px 11px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 24px 50px rgba(0,0,0,.6)}
.screen{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;background:var(--screen);border-radius:6px;overflow:hidden;box-shadow:inset 0 0 50px rgba(0,0,0,.75),0 0 0 1px #000}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);z-index:6}
.chin{height:24px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-family:var(--f-label);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#596067}
.led{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.props{width:120px;flex:none;position:relative}
.mug{position:absolute;left:18px;bottom:26%;width:54px;height:64px;border-radius:4px 4px 12px 12px;background:linear-gradient(90deg,#5b2f2a,#7a3f37 40%,#4a2622);box-shadow:0 10px 18px rgba(0,0,0,.5)}
.mug::before{content:"";position:absolute;right:-16px;top:14px;width:16px;height:26px;border:5px solid #5f322c;border-left:0;border-radius:0 12px 12px 0}
.mug::after{content:"";position:absolute;left:4px;right:4px;top:3px;height:7px;border-radius:50%;background:#1d120d}
.clip{position:absolute;right:6px;bottom:18%;width:96px;height:120px;background:#d9d3c4;border-radius:3px;transform:rotate(7deg);box-shadow:0 10px 20px rgba(0,0,0,.45);padding:22px 9px 0;font-family:var(--f-label);font-size:9px;letter-spacing:.06em;color:#4a4740;line-height:1.5;text-transform:uppercase}
.clip::before{content:"";position:absolute;left:30px;top:-4px;width:36px;height:14px;background:#8b8f94;border-radius:3px}
/* screen chrome */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 12px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-disp);font-size:24px;line-height:.9;color:var(--amber);letter-spacing:.03em}
.brand small{display:block;font-family:var(--f-label);font-size:10px;letter-spacing:.2em;color:var(--muted)}
.stat{display:flex;flex-direction:column;line-height:1.05;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--f-disp);font-size:21px;font-weight:400;color:var(--ink)}
.stat span{font-family:var(--f-label);font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.stat b.ok{color:var(--ok)}.stat b.warn{color:var(--warn)}.stat b.crit{color:var(--crit)}
.speed{margin-left:auto;display:flex;gap:3px}
.btn{font:inherit;font-size:11.5px;background:transparent;color:var(--amber);border:1px solid var(--amber-dim);padding:4px 9px;border-radius:2px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(240,180,76,.12)}
.btn.on,.btn.on:hover:not(:disabled){background:var(--amber);color:#1a1307;border-color:var(--amber)}
.btn:disabled{opacity:.33;cursor:not-allowed}
.btn.go{color:var(--ok);border-color:rgba(136,210,127,.6)}
.btn.go:hover:not(:disabled){background:rgba(136,210,127,.12)}
.btn.big{font-size:14px;padding:8px 16px}
.btn.cy{color:var(--cyan);border-color:rgba(98,203,215,.5)}
.btn.red{color:var(--crit);border-color:rgba(255,92,80,.5)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{font-family:var(--f-label);font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:7px 14px 6px;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.tab i{font-style:normal;font-family:var(--f-ui);font-size:10px;margin-left:5px;padding:0 5px;border-radius:2px;background:var(--crit);color:#1a0b09;letter-spacing:0}
.tab i.n{background:var(--amber)}
.panel{flex:1;min-height:0;overflow:auto;padding:12px 14px 16px}
.ticker{border-top:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker time{color:var(--muted);margin-right:10px}
.secH{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;margin:2px 0 10px}
.secH h2{font-family:var(--f-label);font-size:18px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0}
.secH p{margin:0;color:var(--muted);font-size:11.5px}
.h{font-family:var(--f-label);font-size:12px;font-weight:600;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin:0}
.muted{color:var(--muted)}.okc{color:var(--ok)}.warnc{color:var(--warn)}.critc{color:var(--crit)}.cyc{color:var(--cyan)}
/* supply */
.res{display:grid;grid-template-columns:minmax(150px,1.2fr) minmax(110px,2fr) 112px 150px;gap:6px 14px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--rule)}
.res .nm b{display:block;font-weight:500}
.res .nm small{color:var(--muted);font-size:11px}
.gauge{height:11px;background:rgba(255,255,255,.04);border:1px solid var(--rule);position:relative;overflow:hidden}
.gauge i{position:absolute;top:0;bottom:0;left:0;background:var(--amber)}
.gauge u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(98,203,215,.55) 0 3px,transparent 3px 6px)}
.gauge.low i{background:var(--warn)}.gauge.crit i{background:var(--crit)}
.qty{font-family:var(--f-disp);font-size:20px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.qty small{font-family:var(--f-ui);font-size:10.5px;color:var(--muted)}
.res .btn{justify-self:end}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.list{display:flex;flex-direction:column;gap:5px;font-size:12px}
.list div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--rule);padding-bottom:4px}
/* flightline */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:10px}
.ac{border:1px solid var(--rule);padding:10px;display:flex;flex-direction:column;gap:7px;background:rgba(255,255,255,.015);min-width:0}
.ac.lost{opacity:.6}
.ac header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.call{font-family:var(--f-disp);font-size:24px;line-height:.9;color:var(--ink)}
.sub{font-size:11px;color:var(--muted)}
.chip{font-family:var(--f-label);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:1px 6px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.crit{color:var(--crit)}.chip.air{color:var(--cyan)}.chip.idle{color:var(--muted)}
.bars{display:grid;grid-template-columns:62px 1fr 34px;gap:4px 8px;align-items:center;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bars .gauge{height:7px}
.bars em{font-style:normal;text-align:right;color:var(--ink)}
.load{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 10px}
.load b{color:var(--ink);font-weight:500}
.task{font-size:11.5px;color:var(--warn);min-height:16px}
.acts{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.seg{display:inline-flex}
.seg .btn{border-radius:0;margin-left:-1px}
.seg .btn:first-child{border-radius:2px 0 0 2px;margin-left:0}
.seg .btn:last-child{border-radius:0 2px 2px 0}
/* missions */
.msplit{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:14px;align-items:start}
.mlist{display:flex;flex-direction:column;gap:6px}
.mi{text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--rule);padding:8px 10px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;border-radius:0}
.mi:hover{border-color:var(--amber-dim)}
.mi.sel{border-color:var(--amber);background:rgba(240,180,76,.05)}
.mi .t{font-family:var(--f-label);font-size:17px;font-weight:600;letter-spacing:.08em;color:var(--amber)}
.mi .ty{font-size:11px;color:var(--muted);text-align:right}
.mi small{font-size:11px;color:var(--muted)}
.mi.int .t{color:var(--crit)}
.pips{letter-spacing:1px;color:var(--crit);font-size:11px}
.pips s{text-decoration:none;color:rgba(125,143,137,.4)}
.plan{border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.plan h3{font-family:var(--f-disp);font-size:30px;font-weight:400;color:var(--amber);margin:0;line-height:.9}
.plan p{margin:0;line-height:1.5;max-width:62ch}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pk{font:inherit;font-size:11.5px;text-align:left;color:var(--ink);background:transparent;border:1px solid var(--rule);padding:5px 8px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:118px;border-radius:2px}
.pk small{color:var(--muted);font-size:10.5px}
.pk.on{border-color:var(--cyan);background:rgba(98,203,215,.1)}
.pk:disabled{opacity:.38;cursor:not-allowed}
.tact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.tact > div{display:flex;flex-direction:column;gap:5px;min-width:0}
.tact .seg{flex-wrap:wrap}
.tact small{color:var(--muted);font-size:11px;min-height:2.6em;line-height:1.3}
.est{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--muted)}
.est b{color:var(--ink);font-weight:500}
.empty{color:var(--muted);border:1px dashed var(--rule);padding:16px;line-height:1.5}
/* tactical */
.tac{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;height:100%;min-height:340px}
.scope{position:relative;min-height:300px;border:1px solid var(--grid);background:#071010}
#tacmap{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.side{display:flex;flex-direction:column;gap:10px;min-width:0;overflow:auto}
.fl{font:inherit;color:inherit;text-align:left;background:transparent;border:1px solid var(--rule);padding:6px 9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:12px;border-radius:0}
.fl.on{border-color:var(--cyan);background:rgba(98,203,215,.08)}
.mem{display:grid;grid-template-columns:1fr auto auto;gap:3px 10px;font-size:11.5px;font-variant-numeric:tabular-nums}
/* log */
.log{display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.45}
.log div{display:grid;grid-template-columns:76px 1fr;gap:10px}
.log time{color:var(--muted);font-variant-numeric:tabular-nums}
.log .radio{color:var(--cyan)}.log .warn{color:var(--warn)}.log .crit{color:var(--crit)}.log .good{color:var(--ok)}
/* overlay */
.overlay{position:absolute;inset:0;background:rgba(4,9,9,.92);display:flex;align-items:flex-start;justify-content:center;padding:16px;z-index:5;overflow:auto}
.overlay > .brief{margin:auto}
.brief{max-width:600px;border:1px solid var(--amber-dim);padding:22px 24px;display:flex;flex-direction:column;gap:12px;background:var(--screen)}
.brief h1{font-family:var(--f-disp);font-size:44px;font-weight:400;color:var(--amber);margin:0;line-height:.85;text-wrap:balance}
.brief p{margin:0;line-height:1.55;max-width:62ch}
.brief ul{margin:0;padding-left:18px;line-height:1.6;color:var(--muted)}
.brief ul b{color:var(--ink);font-weight:500}
.brief .acts{gap:10px;margin-top:4px}
.lvl{letter-spacing:2px;color:var(--amber);font-size:12px;white-space:nowrap}.lvl s{text-decoration:none;color:rgba(125,143,137,.35)}
.prog{height:6px;margin-top:6px;max-width:420px;background:rgba(255,255,255,.05);border:1px solid var(--rule);position:relative}.prog i{position:absolute;top:0;bottom:0;left:0;background:var(--cyan)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.stats3 b{display:block;color:var(--ink);font-weight:500;text-transform:none;letter-spacing:0;font-size:12px}
.panel > p{margin:0}
.objs{display:flex;flex-direction:column;gap:6px}
.objs div{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px dashed var(--rule);padding-bottom:5px}
.xp{display:flex;flex-direction:column;gap:2px;max-width:520px}
.xp .prog{max-width:none}
.xpl{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.xpl b{font-family:var(--f-disp);font-size:26px;font-weight:400;color:var(--amber);line-height:1}
.xpl span{color:var(--muted);font-size:11.5px}
.ladder{display:flex;flex-direction:column;gap:4px}
.rk{display:grid;grid-template-columns:210px minmax(0,1fr);gap:4px 12px;padding:7px 10px;border:1px solid var(--rule);font-size:12px;color:var(--muted);align-items:center}
.rk b{display:block;font-weight:500}.rk small{font-size:10.5px}
.rk.got b{color:var(--ok)}.rk.got{color:var(--ink)}.rk.cur{border-color:var(--amber);background:rgba(240,180,76,.05)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{font:inherit;color:inherit;text-align:left;background:transparent;border:1px solid var(--rule);padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:5px;border-radius:2px}
.mode:hover{border-color:var(--amber)}
.mode b{font-family:var(--f-label);font-size:18px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--amber)}
.mode span{color:var(--muted);font-size:12px;line-height:1.45}
.mode.go b{color:var(--ok)}
@media (max-width:820px){.rk{grid-template-columns:1fr}.modes{grid-template-columns:1fr}}
/* ---- Pixel and paper look: hard edges, flat muted colours, stamped documents on a clipboard ---- */
*{border-radius:0!important}
body{background:var(--wall) repeating-conic-gradient(#241e19 0 25%,transparent 0 50%) 0 0/4px 4px;font-size:14px}
.windowband{background:transparent}
.window{padding:12px;box-shadow:0 0 0 3px #0f0c0a,6px 8px 0 rgba(0,0,0,.45)}
#outside{image-rendering:crisp-edges;image-rendering:pixelated}
.glass::after{background:linear-gradient(112deg,transparent 0 18%,rgba(255,255,255,.06) 18% 23%,transparent 23% 62%,rgba(255,255,255,.04) 62% 64%,transparent 64%)}
.mullion{width:10px;margin-left:-5px;box-shadow:none}
.blinds{left:12px;right:12px;top:12px;background:repeating-linear-gradient(to bottom,#6b5c4a 0 4px,#40352c 4px 6px);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.plate{font-family:var(--f-label);font-size:10px;letter-spacing:.06em;color:#bba98a}
.desk{background:var(--desk) repeating-conic-gradient(#5c4e3f 0 25%,transparent 0 50%) 0 0/4px 4px;border-top:10px solid #2e2620;padding-top:18px}
.monitor{position:relative;background:var(--bezel);padding:22px 12px 0;box-shadow:inset 0 0 0 3px #4a3a28,6px 0 0 rgba(0,0,0,.3)}
.monitor::before{content:"";position:absolute;left:50%;top:-8px;width:120px;margin-left:-60px;height:22px;background:#8da3a8;box-shadow:inset 0 -5px 0 #566b76,0 4px 0 rgba(0,0,0,.35);z-index:7}
.screen{background:var(--screen);box-shadow:4px 4px 0 rgba(0,0,0,.35)}
.screen::after{background:repeating-conic-gradient(rgba(46,38,32,.035) 0 25%,transparent 0 50%) 0 0/4px 4px}
.chin{color:#d4c4a2;font-family:var(--f-label);font-size:10px;letter-spacing:.06em}
.led{background:var(--crit);box-shadow:none}
.topbar{background:var(--lcd);border-bottom:3px solid var(--ink)}
.brand{color:var(--lcd-ink);font-size:30px}
.brand small{color:var(--lcd-dim);font-family:var(--f-label);font-size:9px;letter-spacing:.06em}
.stat b{color:#ece0c2;font-size:25px}
.stat span{color:var(--lcd-dim);font-family:var(--f-label);font-size:9px;letter-spacing:.04em}
.stat b.ok{color:#9cc070}.stat b.warn{color:#e6c25a}.stat b.crit{color:#e8714d}
.btn{font-family:var(--f-label);font-size:11px;border-width:2px;letter-spacing:.02em;padding:4px 8px}
.btn:hover:not(:disabled){background:rgba(46,38,32,.1)}
.btn.on,.btn.on:hover:not(:disabled){background:var(--ink);color:var(--screen);border-color:var(--ink)}
.btn.big{font-size:14px;padding:8px 14px;border-width:3px}
.topbar .btn{color:#ece0c2;border-color:#85745d}
.topbar .btn:hover:not(:disabled){background:rgba(236,224,194,.12)}

// ---------- Logistics ----------

}

// ---------- Launch ----------

function bingo(f) {

  S.debrief = { n: sh.n, name: sh.name, objectives: sh.objectives.map((o, i) => ({ text: objText(o), done: res[i] })), met, xp, missionXP, cash, r0, r1: rankIdx(),
    won: d('won'), kills: d('kills'), lost: d('lost'), raids: sh.raidsHit };
  log(`${sh.name} ${sh.n} complete: ${met} of ${res.length} objectives, +${xp + missionXP} XP.`, 'good');
}

// ---------- Campaign screens ----------
function xpBar() {
  const r = rankIdx(), cur = CAREER[r], nxt = CAREER[r + 1];
  const p = nxt ? (S.xp - cur.xp) / (nxt.xp - cur.xp) : 1;
  return `<div class="xp"><div class="xpl"><b>${cur.name}</b><span>${S.xp} XP${nxt ? ` · ${nxt.xp - S.xp} to ${nxt.name}` : ' · highest rank'}</span></div>${progBar(p)}</div>`;
}
function debriefHTML() {
  const d = S.debrief, promo = d.r1 > d.r0;
  const unlocked = CAREER.slice(d.r0 + 1, d.r1 + 1).flatMap(c => c.unlocks).map(unlockName).join(', ');
  return `<div class="brief" role="dialog" aria-labelledby="ovt"><p class="h">Shift report · ${d.name} ${d.n}</p>
    <h1 id="ovt">${d.met === d.objectives.length ? 'Clean shift' : `${d.met} of ${d.objectives.length} objectives`}</h1>
    <div class="objs">${d.objectives.map(o => `<div><span>${o.text}</span><span class="chip ${o.done ? 'ok' : 'crit'}">${o.done ? 'Done' : 'Missed'}</span></div>`).join('')}</div>
    <p class="muted">${d.won} operations completed · ${d.kills} kills · ${d.lost} jets lost · ${d.raids} raids on the base</p>
    <p>+${d.missionXP} XP from operations, +${d.xp} XP for the shift${d.cash ? `, ${money(d.cash)} budget bonus` : ''}.</p>
    ${promo ? `<p class="okc">Promoted to ${CAREER[d.r1].name}. Unlocked: ${unlocked}.</p>` : ''}
    ${xpBar()}
    <div class="acts"><button class="btn go big" data-act="nextshift">Start ${shiftName(S.t)} ${d.n + 1}</button></div></div>`;
}
function careerHTML() {
  const sh = S.shift, r = rankIdx();
  const objs = sh ? sh.objectives.map(o => { const st = objState(o); return `<div><span>${objText(o)}</span><span class="chip ${st.done ? 'ok' : st.failed ? 'crit' : 'idle'}">${st.label}</span></div>`; }).join('') : '';
  const ladder = CAREER.map((c, i) => `<div class="rk${i <= r ? ' got' : ''}${i === r ? ' cur' : ''}"><div><b>${c.name}</b><small>${c.xp.toLocaleString('en-US')} XP</small></div><span>${c.unlocks.map(unlockName).join(' · ')}</span></div>`).join('');
  return `<div class="secH"><h2>Career</h2><p>${S.shiftsDone || 0} shifts served · ${S.stars || 0} objectives met</p></div>${xpBar()}
    ${sh ? `<div class="secH" style="margin-top:18px"><h2>${sh.name} ${sh.n}</h2><p>Ends ${fmtClock(sh.end)}, in ${fmtDur(sh.end - S.t)}. Each objective met: +40 XP and ${money(150)}.</p></div><div class="objs">${objs}</div>` : ''}
    <div class="secH" style="margin-top:18px"><h2>Ranks and unlocks</h2><p>XP comes from operations, kills and shift objectives.</p></div><div class="ladder">${ladder}</div>`;
}
// ---------- Window view: sky, scenery, airfield ----------
const cv = $('#outside'), cx = cv.getContext('2d', { willReadFrequently: true });
let PX = 3;   // size of one screen pixel of the window view, in CSS px
let W = 300, H = 150, STARS = [], CLOUDS = [], TREES = [];
const G = { hz: 0.40, bld: 0.478, rwy: 0.575, rwyH: 0.046, twy: 0.69, twyH: 0.024, apr: 0.875 };
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const shade = (c, k) => c.map(v => Math.round(v * k));
function ell(x, y, rx, ry) { cx.beginPath(); cx.ellipse(x, y, Math.max(0.0005, rx), Math.max(0.0005, ry), 0, 0, Math.PI * 2); cx.fill(); }
function poly(pts) { cx.beginPath(); pts.forEach((p, i) => i ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1])); cx.closePath(); cx.fill(); }
function gsc(y) { return Math.max(0.18, lerp(0.5, 1, (y - G.rwy) / (G.apr - G.rwy))); }
function UL() { return Math.min(W * 0.062, H * 0.21); }

function sizeScene() {
  const r = cv.getBoundingClientRect();
  W = Math.max(60, r.width); H = Math.max(60, r.height);
  // one art pixel = a whole number of device pixels, so the grid stays even
  const dpr = window.devicePixelRatio || 1;
  // 1 art pixel = 1 device pixel on normal screens, 2 on retina; buffer capped at 1400 px wide
  PX = Math.max((dpr >= 2 ? 2 : 1) / dpr, W / 1400);
  cv.width = Math.max(1, Math.round(W / PX)); cv.height = Math.max(1, Math.round(H / PX));
  cx.setTransform(1 / PX, 0, 0, 1 / PX, 0, 0);
}
function initScenery() {
  let s = 7; const sr = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  STARS = Array.from({ length: 80 }, () => [sr(), sr() * 0.36, sr()]);
  TREES = Array.from({ length: 34 }, () => [sr(), 0.6 + sr() * 0.8]);
  CLOUDS = Array.from({ length: 8 }, () => ({ x: sr() * 1.3 - 0.15, y: 0.04 + sr() * 0.24, s: 0.6 + sr() * 0.9, v: 0.004 + sr() * 0.008 }));
}
function daylight() {
  const h = hourOf(S.t);
  if (h < 5 || h >= 20.5) return 0;
  if (h < 7) return (h - 5) / 2;
  if (h >= 18.5) return 1 - (h - 18.5) / 2;
  return 1;
}
function overcast() { return { clear: 0, cloudy: 0.55, rain: 0.85, fog: 0.7, storm: 1 }[S.wx.kind] || 0; }

function drawSky(L, gold, ov, dtR) {
  let top = mix([5, 8, 17], [70, 120, 168], L), bot = mix([15, 22, 38], [176, 201, 214], L);
  top = mix(top, [42, 52, 92], gold * 0.6); bot = mix(bot, [228, 148, 96], gold * 0.75);
  const gr = mix([20, 22, 26], [128, 136, 142], L);
  top = mix(top, gr, ov * 0.75); bot = mix(bot, gr, ov * 0.65);
  const g = cx.createLinearGradient(0, 0, 0, H * G.hz);
  g.addColorStop(0, rgb(top)); g.addColorStop(1, rgb(bot));
  cx.fillStyle = g; cx.fillRect(0, 0, W, H * G.hz + 2);
  if (L < 0.35 && ov < 0.6) {
    for (const st of STARS) { cx.fillStyle = `rgba(225,232,255,${((0.35 - L) / 0.35) * (1 - ov) * (0.35 + st[2] * 0.6)})`; cx.fillRect(st[0] * W, st[1] * H, PX, PX); }
  }
  const h = hourOf(S.t);
  if (h > 5.5 && h < 20) {           // sun
    const u = (h - 5.5) / 14.5, sx = lerp(0.92, 0.06, u) * W, sy = (G.hz - Math.sin(Math.PI * u) * 0.34) * H;
    const rg = cx.createRadialGradient(sx, sy, 0, sx, sy, H * 0.22);
    rg.addColorStop(0, `rgba(255,236,190,${0.9 * (1 - ov * 0.8)})`); rg.addColorStop(0.08, `rgba(255,214,150,${0.5 * (1 - ov)})`); rg.addColorStop(1, 'rgba(255,200,140,0)');
    cx.fillStyle = rg; cx.fillRect(sx - H * 0.22, sy - H * 0.22, H * 0.44, H * 0.44);
  } else if (ov < 0.7) {             // moon
    const u = ((h + 4) % 24) / 9.5, mx = lerp(0.85, 0.15, clamp(u, 0, 1)) * W, my = (0.08 + Math.abs(u - 0.5) * 0.2) * H;
    cx.fillStyle = `rgba(226,230,240,${0.85 * (1 - ov)})`; ell(mx, my, H * 0.022, H * 0.022);
    cx.fillStyle = rgb(top); ell(mx + H * 0.009, my - H * 0.004, H * 0.02, H * 0.02);
  }
  const cc = mix(mix([50, 54, 68], [242, 242, 244], L), mix([30, 32, 36], [168, 172, 178], L), ov);
  const n = Math.round(4 + ov * 4);
  for (let i = 0; i < n; i++) {
    const c = CLOUDS[i];
    c.x += c.v * dtR * (0.4 + S.wx.kt / 14) * (S.speed ? 1 : 0.2);
    if (c.x > 1.25) c.x = -0.25;
    const x = c.x * W, y = c.y * H, r = c.s * W * 0.05 * (1 + ov * 0.6);
    cx.fillStyle = rgb(cc, 0.45 + ov * 0.45);
    ell(x, y, r * 1.6, r * 0.45); ell(x - r * 0.7, y + r * 0.08, r * 0.9, r * 0.35); ell(x + r * 0.5, y - r * 0.2, r * 0.8, r * 0.42);
  }
}

function drawFarSide(L, ov, now) {
  const haze = mix(mix([12, 16, 20], [96, 112, 118], L), mix([20, 22, 26], [140, 146, 150], L), ov * 0.6);
  cx.fillStyle = rgb(haze);
  cx.beginPath(); cx.moveTo(0, G.hz * H);
  for (let i = 0; i <= 40; i++) { const x = i / 40; cx.lineTo(x * W, (0.372 + Math.sin(i * 0.9) * 0.01 + Math.sin(i * 0.37 + 1) * 0.018) * H); }
  cx.lineTo(W, G.hz * H); cx.closePath(); cx.fill();
  const gTop = mix([18, 22, 22], [122, 132, 104], L), gBot = mix([12, 15, 14], [82, 98, 60], L);
  const g = cx.createLinearGradient(0, G.hz * H, 0, H);
  g.addColorStop(0, rgb(mix(gTop, haze, 0.3))); g.addColorStop(1, rgb(gBot));
  cx.fillStyle = g; cx.fillRect(0, G.hz * H, W, H * (1 - G.hz));
  const tree = mix([8, 11, 10], [52, 68, 50], L);
  cx.fillStyle = rgb(mix(tree, haze, 0.35));
  for (const t of TREES) ell(t[0] * W, G.hz * H + 1, W * 0.012 * t[1], H * 0.012 * t[1]);

  const k = 0.22 + 0.78 * L, base = G.bld * H, night = 1 - L;
  const box = (x, w, h, col) => { cx.fillStyle = rgb(shade(col, k)); cx.fillRect(x * W, base - h * H, w * W, h * H); };
  drawHangars(k, night, now, base);
  // ops building with window rows
  box(0.39, 0.105, 0.034, [150, 146, 136]);
  for (let r = 0; r < 2; r++) for (let i = 0; i < 9; i++) {
    cx.fillStyle = night > 0.3 && (i * 7 + r * 3) % 5 ? `rgba(255,214,150,${0.35 + night * 0.5})` : rgb(shade([60, 70, 78], k));
    cx.fillRect((0.397 + i * 0.0108) * W, base - (0.027 - r * 0.012) * H, W * 0.007, Math.max(PX, H * 0.006));
  }
  // control tower
  box(0.515, 0.012, 0.12, [160, 156, 146]);
  cx.fillStyle = rgb(shade([120, 118, 110], k)); cx.fillRect(0.504 * W, base - 0.152 * H, 0.034 * W, 0.006 * H);
  cx.fillStyle = night > 0.3 ? `rgba(120,200,190,${0.4 + night * 0.4})` : rgb(shade([46, 72, 80], k));
  cx.fillRect(0.506 * W, base - 0.146 * H, 0.03 * W, 0.024 * H);
  cx.fillStyle = rgb(shade([90, 92, 90], k)); cx.fillRect(0.504 * W, base - 0.124 * H, 0.034 * W, 0.004 * H);
  if (night > 0.2) { const on = (now / 900) % 2 < 1; cx.fillStyle = on ? 'rgba(120,255,150,.95)' : 'rgba(255,255,240,.95)'; ell(0.521 * W, base - 0.158 * H, PX, PX); }
  // radar head
  const rx = 0.578 * W;
  cx.fillStyle = rgb(shade([110, 112, 108], k)); cx.fillRect(rx - 2, base - 0.05 * H, 4, 0.05 * H);
  const span = Math.abs(Math.cos(now / 700)) * W * 0.016 + 1.5;
  cx.fillStyle = rgb(shade([190, 190, 184], k)); cx.fillRect(rx - span, base - 0.058 * H, span * 2, 0.007 * H);
  // fuel farm, tank tops tinted by stock level
  const lvl = S.res.fuel / capOf('fuel');
  for (const x of [0.86, 0.905, 0.95, 0.815, 0.77].slice(0, 3 + S.base.fuelfarm)) {
    box(x - 0.015, 0.03, 0.036, [176, 178, 172]);
    cx.fillStyle = rgb(shade([196, 198, 192], k)); ell(x * W, base - 0.036 * H, 0.015 * W, 0.004 * H);
    cx.fillStyle = rgb(shade([96, 100, 98], k)); cx.fillRect((x - 0.015) * W, base - 0.036 * H * lvl - 1, 0.03 * W, PX);
  }
}

function drawAirfield(L, now) {
  const k = 0.22 + 0.78 * L, night = 1 - L;
  const asph = shade([66, 68, 70], k), conc = shade([146, 146, 140], k), paint = `rgba(235,235,230,${0.35 + 0.4 * L})`;
  const ry0 = (G.rwy - G.rwyH / 2) * H, rh = G.rwyH * H;
  const ty0 = (G.twy - G.twyH / 2) * H, th = G.twyH * H;
  cx.fillStyle = rgb(asph);
  poly([[0.14 * W, ry0 + rh], [0.19 * W, ry0 + rh], [0.135 * W, ty0], [0.085 * W, ty0]]);
  poly([[0.93 * W, ry0 + rh], [0.97 * W, ry0 + rh], [0.89 * W, ty0], [0.85 * W, ty0]]);
  cx.fillRect(0, ry0, W, rh);
  cx.fillStyle = rgb(shade([74, 76, 76], k)); cx.fillRect(0, ty0, W, th);
  cx.fillStyle = paint;
  cx.fillRect(0, ry0 + PX, W, PX); cx.fillRect(0, ry0 + rh - 2 * PX, W, PX);
  for (let x = 0.08; x < 0.92; x += 0.05) cx.fillRect(x * W, ry0 + rh / 2 - PX / 2, 0.025 * W, PX);
  for (let i = 1; i < 7; i++) { cx.fillRect(0.936 * W, ry0 + rh * i / 7.5, 0.026 * W, PX); cx.fillRect(0.038 * W, ry0 + rh * i / 7.5, 0.026 * W, PX); }
  for (const x of [0.84, 0.8]) { cx.fillRect(x * W, ry0 + rh * 0.22, 0.02 * W, PX); cx.fillRect(x * W, ry0 + rh * 0.74, 0.02 * W, PX); }
  cx.fillStyle = `rgba(232,190,60,${0.4 + 0.4 * L})`; cx.fillRect(0, G.twy * H - PX / 2, W, PX);
  // apron and lead-in stubs
  const ay = 0.765 * H;
  cx.fillStyle = rgb(conc);
  for (const x of [...SPOTS, CARGO_SPOT]) cx.fillRect((x - 0.018) * W, ty0 + th, 0.036 * W, ay - ty0 - th + 1);
  cx.fillRect(0, ay, W, H - ay);
  cx.strokeStyle = rgb(shade([112, 112, 106], k)); cx.lineWidth = PX; cx.beginPath();
  for (let y = ay + 0.04 * H; y < H; y += 0.045 * H) { cx.moveTo(0, y); cx.lineTo(W, y); }
  for (let x = 0.035; x < 1; x += 0.07) { cx.moveTo(x * W, ay); cx.lineTo(x * W, H); }
  cx.stroke();
  cx.fillStyle = `rgba(232,190,60,${0.45 + 0.4 * L})`;
  cx.font = `${Math.round(Math.max(8, 14 / PX)) * PX}px "Silkscreen", monospace`; cx.textAlign = 'center';
  [...SPOTS, CARGO_SPOT].forEach((x, i) => {
    cx.fillRect(x * W - PX / 2, G.twy * H, PX, (G.apr - G.twy) * H);
    cx.fillRect((x - 0.02) * W, G.apr * H + 3, 0.04 * W, PX);
    cx.fillText(i < SPOTS.length ? pad2(i + 1) : 'C1', x * W, (G.apr + 0.07) * H);
  });
  if (S.t < S.runway.closedUntil) {          // runway closed: craters and X markers
    cx.fillStyle = 'rgba(18,16,14,.85)';
    for (const f of S.fx) if (f.kind === 'smoke' && f.at === 'rwy') ell(f.x * W, G.rwy * H, W * 0.022, rh * 0.32);
    cx.strokeStyle = 'rgba(245,210,70,.85)'; cx.lineWidth = PX;
    for (const x of [0.22, 0.6]) { cx.beginPath(); cx.moveTo(x * W - rh * 0.5, ry0 + 2); cx.lineTo(x * W + rh * 0.5, ry0 + rh - 2); cx.moveTo(x * W + rh * 0.5, ry0 + 2); cx.lineTo(x * W - rh * 0.5, ry0 + rh - 2); cx.stroke(); }
  }
  drawBaseExtras(L, k, now);
  if (night > 0.25) {
    const a = (night - 0.25) / 0.75;
    for (let x = 0.01; x < 1; x += 0.04) { cx.fillStyle = `rgba(255,240,200,${0.85 * a})`; cx.fillRect(x * W, ry0 - PX / 2, PX, PX); cx.fillRect(x * W, ry0 + rh - PX / 2, PX, PX); }
    for (let i = 0; i < 6; i++) { cx.fillStyle = `rgba(90,255,140,${a})`; cx.fillRect(0.972 * W, ry0 + rh * i / 5 - PX / 2, PX, PX); cx.fillStyle = `rgba(255,70,60,${a})`; cx.fillRect(0.012 * W, ry0 + rh * i / 5 - PX / 2, PX, PX); }
    for (let x = 0.02; x < 1; x += 0.05) { cx.fillStyle = `rgba(80,140,255,${0.8 * a})`; cx.fillRect(x * W, ty0 - PX, PX, PX); cx.fillRect(x * W, ty0 + th, PX, PX); }
    for (const x of [0.2, 0.5, 0.8]) {
      const pg = cx.createRadialGradient(x * W, 0.9 * H, 0, x * W, 0.9 * H, W * 0.16);
      pg.addColorStop(0, `rgba(255,214,150,${0.3 * a})`); pg.addColorStop(1, 'rgba(255,214,150,0)');
      cx.fillStyle = pg; cx.fillRect(x * W - W * 0.16, 0.74 * H, W * 0.32, H * 0.26);
    }
  }
  for (const x of [0.2, 0.5, 0.8]) {         // light masts
    cx.fillStyle = rgb(shade([90, 92, 92], k)); cx.fillRect(x * W - PX / 2, 0.708 * H, PX, 0.06 * H);
    cx.fillStyle = night > 0.25 ? 'rgba(255,230,180,.95)' : rgb(shade([150, 150, 146], k)); cx.fillRect(x * W - 2 * PX, 0.703 * H, 4 * PX, PX);
  }
}

const PALETTE = [
  '#0f0c0a', '#1e1915', '#2e2620', '#40352c', '#54473a', '#6b5c4a', '#85745d', '#a08e72', '#bba98a', '#d4c4a2', '#ece0c2',

  '#4a4a46', '#6e6e68', '#94948c', '#bcbcb2',
  '#252c1c', '#343f26', '#465432', '#5c6b40', '#76844f', '#86b866',
  '#4a1f19', '#7a2e1f', '#a3412a', '#c8653a', '#e09a52',
  '#b8902e', '#e6c25a', '#f4e3a0', '#5f7fc0',
];
const PAL = PALETTE.map(h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]);
const PAL32 = new Uint32Array(PAL.map(([r, g, b]) => ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0));
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v / 16 - 0.47) * 14);
let LUT = null;
function buildLUT() {
  LUT = new Uint8Array(32768);
  for (let r = 0; r < 32; r++) for (let g = 0; g < 32; g++) for (let b = 0; b < 32; b++) {
    const R = r * 8 + 4, Gc = g * 8 + 4, B = b * 8 + 4;
    let best = 0, bd = 1e12;
    for (let i = 0; i < PAL.length; i++) {
      const p = PAL[i], dr = R - p[0], dg = Gc - p[1], db = B - p[2], d = 2 * dr * dr + 4 * dg * dg + 3 * db * db;
      if (d < bd) { bd = d; best = i; }

  }
}
function quantize() {

  const img = cx.getImageData(0, 0, w, h), px = new Uint32Array(img.data.buffer);
  for (let y = 0, i = 0; y < h; y++) {
    const row = (y & 3) * 4;
    for (let x = 0; x < w; x++, i++) {
      const v = px[i], t = BAYER[row + (x & 3)];
      let r = (v & 255) + t, g = ((v >> 8) & 255) + t, b = ((v >> 16) & 255) + t;
      r = r < 0 ? 0 : r > 255 ? 31 : r >> 3; g = g < 0 ? 0 : g > 255 ? 31 : g >> 3; b = b < 0 ? 0 : b > 255 ? 31 : b >> 3;
      px[i] = PAL32[LUT[(r << 10) | (g << 5) | b]];

const SND = { ctx: null, on: true, L: null, radioBusy: 0 };

function audioInit() {
  if (!SND.on) return;

    const c = new AC(); SND.ctx = c;

      const b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = b.getChannelData(0); let last = 0;
      for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w; }

    const gain = v => { const g = c.createGain(); g.gain.value = v; return g; };
    const filt = (type, f, q = 0.7) => { const x = c.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; };

    o1.type = 'sine'; o1.frequency.value = 960; o2.type = 'triangle'; o2.frequency.value = 1420;
    o1.connect(whG); o2.connect(whG); whG.connect(out); o1.start(); o2.start();

    p1.type = 'sawtooth'; p1.frequency.value = 74; p2.type = 'sawtooth'; p2.frequency.value = 75.6;
    p1.connect(prF); p2.connect(prF); prF.connect(prG); prG.connect(out); p1.start(); p2.start();

}

function audioFrame() {

  let roar = 0, idle = 0, prop = 0, px = 0.5;
  const consider = o => {
    const ph = o.phase; if (!ph || ph === 'inbound' || ph === 'unload' || (ph === 'taxi' && o.phT <= 0)) return;

    if (ph === 'roll') { const t = o.phT / DEP.roll; r = t < 0.2 ? 0.3 : 0.5 + 0.5 * t; }
    else if (ph === 'climb') r = 1 - (o.phT / DEP.climb) * 0.85;
    else if (ph === 'final') r = 0.15 + 0.3 * (o.phT / ARR.final);

  S.fleet.forEach(consider); S.cargo.forEach(consider);

  L.roarF.frequency.setTargetAtTime(420 + roar * 1100, SND.ctx.currentTime, 0.2);
  if (L.pan) L.pan.pan.setTargetAtTime(clamp(px * 2 - 1, -1, 1) * 0.8, SND.ctx.currentTime, 0.2);

}

function sfxChime() { if (ready()) { tone('triangle', 880, 0.25, 0.03); tone('triangle', 1320, 0.35, 0.03, 0.12); } }

// ---------- Terminal chrome, tactical map, input, main loop ----------
const TABS = [['missions', 'Tasking'], ['flightline', 'Flightline'], ['supply', 'Supply'], ['base', 'Base'], ['tac', 'Tac map'], ['log', 'Comms']];

// ---------- Tactical map ----------
const COAST = Array.from({ length: 33 }, (_, i) => { const y = -320 + i * 20; return [130 + Math.sin(y / 60) * 34 + Math.sin(y / 23) * 12, y]; });
let TAC = { ox: 0, oy: 0, s: 1 };
function drawTac(now) {

  g.fillStyle = 'rgba(45,60,71,.2)'; g.beginPath(); COAST.forEach(([x, y], i) => { const p = P(x, y); i ? g.lineTo(...p) : g.moveTo(...p); }); g.lineTo(w + 10, h + 10); g.lineTo(w + 10, -10); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(46,38,32,.75)'; g.lineWidth = 2; g.beginPath(); COAST.forEach(([x, y], i) => { const p = P(x, y); i ? g.lineTo(...p) : g.moveTo(...p); }); g.stroke();
  g.strokeStyle = 'rgba(46,38,32,.12)'; g.beginPath();
  for (let v = -300; v <= 300; v += 50) { g.moveTo(...P(v, -400)); g.lineTo(...P(v, 400)); g.moveTo(...P(-400, v)); g.lineTo(...P(400, v)); }
  g.stroke();

    g.fillStyle = m.status === 'active' ? '#7a2e1f' : 'rgba(122,46,31,.6)'; g.beginPath(); g.moveTo(x, y - 6); g.lineTo(x + 6, y); g.lineTo(x, y + 6); g.lineTo(x - 6, y); g.closePath(); g.fill();
    if (sel) { g.strokeStyle = '#7a2e1f'; g.strokeRect(x - 9, y - 9, 18, 18); }

function tacClick(e) {

  if (!best) return;
  if (best[0] === 'f') UI.selF = best[1]; else { UI.selM = best[1]; UI.tab = 'missions'; }

}

// ---------- Input ----------
function beginGame(mode) {
  clearSave(); S = newGame(mode); S.started = true;
  UI.resume = false; UI.selM = null; UI.selF = null; UI.pick.clear(); UI.tab = 'missions';
  genMission('CAP');
  log('Shift start. Viper 1-3 needs fuel and weapons, Viper 1-4 needs repairs.');
  if (mode === 'campaign') beginShift();
}
function doAct(d) {
  const a = d.id ? AC(d.id) : null, f = d.f ? FL(d.f) : null;
  switch (d.act) {
    case 'tab': UI.tab = d.tab; break;
    case 'speed': S.speed = +d.v; break;
    case 'order': order(d.k); break;
    case 'turn': turnaround(a); break;
    case 'refuel': queueTask(a, 'refuel'); break;
    case 'repair': queueTask(a, 'repair'); break;
    case 'arm': queueTask(a, 'arm', d.v); break;
    case 'tanker': launch(null, [a.id], { ...DEFAULT_TAC }); break;
    case 'replace': requestReplacement(a); break;
    case 'build': startBuild(d.k); break;
    case 'train': startTraining(d.k); break;
    case 'buy': buyAircraft(d.k); break;
    case 'swap': swapPilot(a); break;
    case 'sound': setSound(!SND.on); break;
    case 'selm': UI.selM = d.id; UI.pick.clear(); break;
    case 'pick': if (UI.pick.has(d.id)) UI.pick.delete(d.id); else if (UI.pick.size < 4) UI.pick.add(d.id); break;
    case 'tac': UI.tac[d.k] = d.v; break;
    case 'launch': {
      const before = S.flights.length;
      if (launch(UI.selM, [...UI.pick], UI.tac)) { UI.pick.clear(); UI.selF = S.flights[before].id; }
      break;
    }
    case 'self': UI.selF = d.id; break;
    case 'ftac': if (f) { f.tac[d.k] = d.v; radio(`${f.call}: copy, ${TAC_OPTS[d.k].label.toLowerCase()} ${TAC_OPTS[d.k].opts.find(o => o[0] === d.v)[1].toLowerCase()}.`); } break;
    case 'rtb': if (f) goRTB(f, 'ordered home'); break;
    case 'tank': if (f) orderTanker(f); break;
    case 'maps': UI.tab = 'tac'; UI.selF = d.f; break;
    case 'campaign': case 'free': beginGame(d.act); break;
    case 'nextshift': beginShift(); break;
    case 'tutorial-start': beginGame('campaign'); tutStart(); break;
    case 'tutorial': if (S.started && !S.over) tutStart(); break;
    case 'tutnext': tutAdvance(); break;
    case 'tutskip': tutEnd(); break;
    case 'resume': S.started = true; UI.resume = false; break;
    case 'new': clearSave(); S = newGame(); UI.resume = false; UI.selM = null; UI.selF = null; UI.pick.clear(); UI.tab = 'missions'; break;
  }
}
document.addEventListener('pointerdown', e => { if (e.target.closest('#panel')) UI.down = true; });
document.addEventListener('pointerup', () => { UI.down = false; });
document.addEventListener('pointercancel', () => { UI.down = false; });
document.addEventListener('click', e => {
  if (e.target.id === 'tacmap') { tacClick(e); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  audioInit(); sfxClick();
  doAct(b.dataset); UI.down = false; renderUI(true);
});
document.addEventListener('keydown', e => {
  if (!S || !S.started || e.target.closest('input,textarea')) return;
  if (e.code === 'Space' && !e.target.closest('button')) { e.preventDefault(); S.speed = S.speed ? 0 : 1; renderUI(true); }
  if (/^Digit[1-4]$/.test(e.code)) { S.speed = +e.code.slice(5); renderUI(true); }
});

// ---------- Main loop ----------
let lastNow = performance.now(), uiAcc = 0, saveAcc = 0;
function frame(now) {
  const dtR = Math.min(0.1, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
  if (S.started && !S.over && !S.debrief) { let g = dtR * SPEEDS[S.speed]; while (g > 1e-6 && !S.debrief && !S.over) { const st = Math.min(0.25, g); step(st); g -= st; } }
  drawScene(now, dtR);
  audioFrame();
  if (UI.tab === 'tac') drawTac(now);
  uiAcc += dtR; if (uiAcc >= 0.25) { uiAcc = 0; renderUI(); }
  saveAcc += dtR; if (saveAcc >= 6) { saveAcc = 0; if (S.started || S.over) saveGame(); }
  requestAnimationFrame(frame);
}
function boot(data) {
  const hot = data && data.S;
  S = hot || loadGame() || newGame();
  if (!hot && S.started && !S.over) { UI.resume = true; S.started = false; }
  initScenery(); sizeScene();
  try { new ResizeObserver(sizeScene).observe(cv); } catch (e) { window.addEventListener('resize', sizeScene); }
  renderUI(true);
  requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) { /* not in a viewer */ }
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
